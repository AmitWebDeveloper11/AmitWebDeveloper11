<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6FF00" stop-opacity="0"/><stop offset=".5" stop-color="#B6FF00"/><stop offset="1" stop-color="#B6FF00" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'Courier New',Consolas,monospace}
      .sw{animation:sw 5s ease-in-out infinite}
      @keyframes sw{0%{transform:translateX(-300px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(1000px);opacity:0}}
      .dot{animation:b 1.8s ease-in-out infinite}
      @keyframes b{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1000" height="260" fill="#070707"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <circle class="dot" cx="60" cy="62" r="4" fill="#B6FF00"/>
  <text class="mono" x="74" y="67" font-size="13" fill="#8a8a8a" letter-spacing="3">AVAILABLE FOR WORK</text>

  <text class="mono" x="58" y="148" font-size="72" font-weight="bold" fill="#ffffff" letter-spacing="8">AMIT PANDEY</text>
  <text class="mono" x="60" y="190" font-size="17" fill="#B6FF00" letter-spacing="7">FULL STACK WEB DEVELOPER</text>

  <rect x="60" y="212" width="880" height="1" fill="#ffffff" fill-opacity=".12"/>
  <rect class="sw" x="60" y="211" width="260" height="3" fill="url(#sweep)"/>
</svg>
