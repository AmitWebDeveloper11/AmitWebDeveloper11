<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05000a"/><stop offset=".55" stop-color="#14052b"/><stop offset="1" stop-color="#2a0b5e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#C084FC"/><stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/><stop offset=".5" stop-color="#00F5FF" stop-opacity=".22"/><stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9B5DE5" stroke-opacity=".13"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'Courier New',Consolas,monospace}
      .scan{animation:scan 4.5s linear infinite}
      @keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(360px)}}
      .g1{animation:g1 3.2s infinite steps(1)}
      .g2{animation:g2 3.2s infinite steps(1)}
      @keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-5px,2px)}94%{transform:translate(4px,-2px)}}
      @keyframes g2{0%,88%,100%{transform:translate(0,0)}91%{transform:translate(5px,-2px)}95%{transform:translate(-4px,2px)}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
      .spin2{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
      .blink{animation:pulse 1s steps(1) infinite}
    </style>
  </defs>

  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>

  <!-- orbit HUD -->
  <g transform="translate(830 170)" opacity=".9">
    <circle r="120" fill="none" stroke="#9B5DE5" stroke-opacity=".25"/>
    <circle class="spin" r="100" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-dasharray="4 14"/>
    <circle class="spin2" r="78" fill="none" stroke="#F72585" stroke-width="1.5" stroke-dasharray="30 12 4 12"/>
    <circle r="52" fill="none" stroke="#C084FC" stroke-opacity=".6"/>
    <circle r="6" fill="#00F5FF" filter="url(#glow)" class="pulse"/>
    <path d="M-130 0H-60M60 0H130M0 -130V-60M0 60V130" stroke="#9B5DE5" stroke-opacity=".5"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#C084FC" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M20 60V20H60"/><path d="M940 20H980V60"/><path d="M20 280V320H60"/><path d="M980 280V320H940"/>
  </g>

  <!-- top status line -->
  <g class="mono" font-size="13" fill="#C084FC">
    <circle cx="42" cy="44" r="4" fill="#00F5FF" class="pulse"/>
    <text x="56" y="49">SYS.ONLINE  //  NODE-01  //  BUILD_MODE: ACTIVE</text>
  </g>

  <!-- name with glitch layers -->
  <g class="mono" font-size="86" font-weight="bold" letter-spacing="6">
    <text class="g1" x="52" y="172" fill="#00F5FF" opacity=".75">AMIT PANDEY</text>
    <text class="g2" x="52" y="172" fill="#F72585" opacity=".75">AMIT PANDEY</text>
    <text x="52" y="172" fill="url(#txt)" filter="url(#glow)">AMIT PANDEY</text>
  </g>

  <text class="mono" x="56" y="222" font-size="22" fill="#e9d5ff" letter-spacing="9">FULL STACK  •  CREATIVE WEB  •  3D  •  AI</text>
  <text class="mono" x="56" y="262" font-size="15" fill="#9B5DE5">&gt; turning ideas into deployed products<tspan class="blink" fill="#00F5FF">█</tspan></text>

  <!-- scanline -->
  <rect class="scan" width="1000" height="80" fill="url(#scan)"/>
  <rect x="1" y="1" width="998" height="338" fill="none" stroke="#9B5DE5" stroke-opacity=".5"/>
</svg>
