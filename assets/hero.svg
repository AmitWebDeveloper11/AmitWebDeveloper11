<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B6FF00" stop-opacity=".45"/><stop offset="1" stop-color="#B6FF00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6FF00" stop-opacity="0"/><stop offset=".5" stop-color="#E6FF80"/><stop offset="1" stop-color="#B6FF00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="200" width="1000" height="140"/></clipPath>
    <filter id="bloom" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'Courier New',Consolas,monospace}
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .h{stroke:#B6FF00;stroke-width:1.2;opacity:0;animation:h 4.5s cubic-bezier(.55,0,1,.8) infinite}
      @keyframes h{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(140px);opacity:.85}}
      .draw{fill:none;stroke:#B6FF00;stroke-width:1.5;stroke-dasharray:500;animation:draw 2.2s ease-out backwards}
      @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
      .fillin{animation:fi 1.2s ease-out 1.4s backwards}
      @keyframes fi{from{opacity:0}to{opacity:1}}
      .sub{animation:fi 1s ease-out 2.2s backwards}
      .dot{animation:tw 1.6s ease-in-out infinite}
      .sw{animation:sw 6s ease-in-out infinite}
      @keyframes sw{0%{transform:translateX(-400px);opacity:0}20%,80%{opacity:.9}100%{transform:translateX(1000px);opacity:0}}
    </style>
  </defs>

  <rect width="1000" height="340" fill="#050505"/>
<circle class="s" style="animation-delay:-0.37s" cx="150" cy="95" r="1.2"/>
<circle class="s" style="animation-delay:-0.74s" cx="230" cy="60" r="1.2"/>
<circle class="s" style="animation-delay:-1.11s" cx="310" cy="120" r="1.8"/>
<circle class="s" style="animation-delay:-1.48s" cx="390" cy="50" r="1.2"/>
<circle class="s" style="animation-delay:-1.85s" cx="450" cy="100" r="1.2"/>
<circle class="s" style="animation-delay:-2.22s" cx="560" cy="45" r="1.8"/>
<circle class="s" style="animation-delay:-2.59s" cx="640" cy="110" r="1.2"/>
<circle class="s" style="animation-delay:-2.96s" cx="720" cy="62" r="1.2"/>
<circle class="s" style="animation-delay:-0.33s" cx="800" cy="100" r="1.8"/>
<circle class="s" style="animation-delay:-0.70s" cx="870" cy="48" r="1.2"/>
<circle class="s" style="animation-delay:-1.07s" cx="930" cy="120" r="1.2"/>
<circle class="s" style="animation-delay:-1.44s" cx="120" cy="150" r="1.8"/>
<circle class="s" style="animation-delay:-1.81s" cx="950" cy="160" r="1.2"/>
<circle class="s" style="animation-delay:-2.18s" cx="40" cy="110" r="1.2"/>
<circle class="s" style="animation-delay:-2.55s" cx="610" cy="150" r="1.8"/>
<circle class="s" style="animation-delay:-2.92s" cx="270" cy="160" r="1.2"/>
<circle class="s" style="animation-delay:-0.29s" cx="740" cy="150" r="1.2"/>

  <ellipse cx="500" cy="200" rx="520" ry="90" fill="url(#glow)"/>

  <!-- perspective floor -->
  <g clip-path="url(#floor)">
    <g stroke="#B6FF00" stroke-opacity=".28" stroke-width="1">
      <line x1="500" y1="200" x2="-1000" y2="345"/>
<line x1="500" y1="200" x2="-870" y2="345"/>
<line x1="500" y1="200" x2="-740" y2="345"/>
<line x1="500" y1="200" x2="-610" y2="345"/>
<line x1="500" y1="200" x2="-480" y2="345"/>
<line x1="500" y1="200" x2="-350" y2="345"/>
<line x1="500" y1="200" x2="-220" y2="345"/>
<line x1="500" y1="200" x2="-90" y2="345"/>
<line x1="500" y1="200" x2="40" y2="345"/>
<line x1="500" y1="200" x2="170" y2="345"/>
<line x1="500" y1="200" x2="300" y2="345"/>
<line x1="500" y1="200" x2="430" y2="345"/>
<line x1="500" y1="200" x2="560" y2="345"/>
<line x1="500" y1="200" x2="690" y2="345"/>
<line x1="500" y1="200" x2="820" y2="345"/>
<line x1="500" y1="200" x2="950" y2="345"/>
<line x1="500" y1="200" x2="1080" y2="345"/>
<line x1="500" y1="200" x2="1210" y2="345"/>
<line x1="500" y1="200" x2="1340" y2="345"/>
<line x1="500" y1="200" x2="1470" y2="345"/>
<line x1="500" y1="200" x2="1600" y2="345"/>
<line x1="500" y1="200" x2="1730" y2="345"/>
<line x1="500" y1="200" x2="1860" y2="345"/>
<line x1="500" y1="200" x2="1990" y2="345"/>

    </g>
    <g>
      <line class="h" style="animation-delay:-0.0s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-0.5s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-1.0s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-1.5s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-2.0s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-2.5s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-3.0s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-3.5s" x1="-300" x2="1300" y1="200" y2="200"/>
<line class="h" style="animation-delay:-4.0s" x1="-300" x2="1300" y1="200" y2="200"/>

    </g>
  </g>
  <rect x="0" y="200" width="1000" height="80" fill="url(#fade)"/>

  <!-- horizon -->
  <rect x="0" y="199" width="1000" height="2" fill="url(#hz)" filter="url(#bloom)"/>
  <rect class="sw" x="0" y="198.5" width="300" height="3" fill="url(#sweep)"/>

  <!-- name -->
  <g class="mono" font-size="82" font-weight="bold" letter-spacing="10" text-anchor="middle">
    <text class="fillin" x="500" y="138" fill="#ffffff" filter="url(#bloom)" fill-opacity=".95">AMIT PANDEY</text>
    <text class="draw" x="500" y="138">AMIT PANDEY</text>
  </g>
  <text class="mono sub" x="500" y="176" font-size="16" fill="#B6FF00" letter-spacing="12" text-anchor="middle">FULL STACK  WEB  DEVELOPER</text>

  <!-- HUD corners -->
  <circle class="dot" cx="40" cy="38" r="4" fill="#B6FF00"/>
  <text class="mono" x="54" y="43" font-size="12" fill="#9a9a9a" letter-spacing="3">AVAILABLE FOR WORK</text>
  <text class="mono" x="960" y="43" font-size="12" fill="#9a9a9a" letter-spacing="3" text-anchor="end">81+ PROJECTS SHIPPED</text>
  <g stroke="#B6FF00" stroke-opacity=".6" stroke-width="1.5" fill="none">
    <path d="M18 70V18H70"/><path d="M930 18H982V70"/>
  </g>
</svg>
